name: Benchmark — MPT

# Lightweight benchmark-CI shape, ported from core-geth's bench-core.yml/bench-trie.yml
# (plain `go test -bench` + pinned-comparison + artifact upload, no self-hosted runner,
# no ChatOps, no disk-snapshot machinery — see
# docs/research/best-practices/evm-clients/repo-patterns/core-geth/build-release-pattern.md).
#
# SUBSTITUTION FROM THE SOURCE PATTERN: core-geth compares its own fork against a pinned
# UPSTREAM go-ethereum tag (a fork-lineage relationship fukuii doesn't have — fukuii is
# not a fork of another EVM client in that sense). fukuii's analogue instead compares the
# current branch's MPT benchmark against a pinned PRIOR FUKUII RELEASE TAG — trend/
# regression visibility against fukuii's own history, not against a different client.
# This is a deliberate substitution, not an oversight — do not "fix" this to point at an
# upstream client; there isn't one to point at.
#
# Runs the MerklePatriciaTreeSpeedSpec benchmark suite (build.sbt's `Benchmark` sbt
# config). Push/dispatch only — no `pull_request` trigger, so this never gates a merge;
# it is visibility, the same as core-geth's own bench-*.yml workflows.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pinned_tag:
        description: 'Pinned prior fukuii release tag to compare against'
        required: false
        default: 'v0.8.0'

permissions:
  contents: read

env:
  BENCH_CLASS: com.chipprbots.ethereum.mpt.MerklePatriciaTreeSpeedSpec

jobs:
  bench-current:
    name: Benchmark current ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Run MPT benchmark
        run: |
          set -o pipefail
          sbt "benchmark:testOnly $BENCH_CLASS" 2>&1 | tee mpt-current.log
        env:
          FUKUII_DEV: true

      - name: Upload current-ref log
        uses: actions/upload-artifact@v6
        with:
          name: mpt-current
          path: mpt-current.log
          retention-days: 30

  bench-pinned:
    name: Benchmark pinned prior release (${{ inputs.pinned_tag || 'v0.8.0' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned tag
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ inputs.pinned_tag || 'v0.8.0' }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Run MPT benchmark on pinned tag
        # If the pinned tag predates the benchmark suite's current package/class name,
        # this step fails loudly rather than silently comparing against nothing — pick a
        # pinned_tag that actually contains the suite.
        run: |
          set -o pipefail
          sbt "benchmark:testOnly $BENCH_CLASS" 2>&1 | tee mpt-pinned.log
        env:
          FUKUII_DEV: true

      - name: Upload pinned-tag log
        uses: actions/upload-artifact@v6
        with:
          name: mpt-pinned
          path: mpt-pinned.log
          retention-days: 30

  compare:
    name: Compare
    needs: [bench-current, bench-pinned]
    runs-on: ubuntu-latest
    steps:
      - name: Download logs
        uses: actions/download-artifact@v6
        with:
          pattern: mpt-*
          merge-multiple: false

      - name: Extract and compare timings
        run: |
          extract() {
            echo "-- $1 --"
            grep -oP 'Time taken\(ms\): \K\d+' "$1" || echo "(no in-memory round timing found)"
            grep -oP 'time for batch is: \K[\d.]+(?= sec)' "$1" || echo "(no RocksDB batch timing found)"
          }
          echo "=== Current ref ==="
          extract mpt-current/mpt-current.log
          echo ""
          echo "=== Pinned release (${{ inputs.pinned_tag || 'v0.8.0' }}) ==="
          extract mpt-pinned/mpt-pinned.log
          echo ""
          echo "See fukuii-benchmark-diff skill (.agents/skills/fukuii-benchmark-diff/) for a" \
               "local-run before/after percentage-delta workflow — this CI job surfaces raw" \
               "numbers for manual trend-watching, it does not compute a delta itself."

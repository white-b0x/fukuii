rules = [
  DisableSyntax
  ExplicitResultTypes
  NoAutoTupling
  NoValInForComprehension
  OrganizeImports
  ProcedureSyntax
  RemoveUnused
]

DisableSyntax {
  noReturns = true
  noFinalize = true
  // Scapegoat-successor rules (added at the sbt-2 cutover, which dropped sbt-scapegoat — no
  // sbt-2-compatible artifact exists for it, see project/plugins.sbt). These three close the
  // highest-value scapegoat inspection classes with zero current violations in the tree:
  //   noNulls          ~ scapegoat NullParameter/NullAssignment
  //   noAsInstanceOf   ~ scapegoat AsInstanceOf (unsafe cast)
  //   noIsInstanceOf   ~ scapegoat IsInstanceOf (unsafe type test)
  // noUniversalEquality (~ scapegoat ComparingUnrelatedTypes, the exact class that caught the
  // historical BN128 BigInt-vs-Int bug per docs/reports/STATIC_ANALYSIS_INVENTORY.md) was
  // evaluated and deliberately NOT enabled: it bans ALL `==`/`!=`, not just unrelated-type
  // comparisons, and the current tree already has ~15 same-type (Int==Int/Char==Char)
  // comparisons in modules/bytes main code that would need `===`/Eq-instance boilerplate for no
  // real safety gain — the same "too many false positives" tradeoff that led this project to
  // disable scapegoat's UnsafeTraversableMethods inspection. Scala 3's compiler already
  // statically flags provably-always-false unrelated-type `==` comparisons by default (no flag
  // needed); `-language:strictEquality` (CanEqual-derivation, full type-safe equality) is the
  // real, comprehensive successor for that specific scapegoat class but is a codebase-wide
  // migration, not a build-tool-cutover change — flag for a future MOD, not landed here.
  noNulls = true
  noAsInstanceOf = true
  noIsInstanceOf = true
}

OrganizeImports {
  groupedImports = Explode
  targetDialect = Scala3
  groups = [
    "re:javax?\\."
    "org.apache.pekko."
    "cats."
    "monix."
    "scala."
    "scala.meta."
    "*"
    "com.chipprbots.ethereum."
  ]
  removeUnused = true
}

RemoveUnused {
  imports = false // handled by OrganizeImports
}
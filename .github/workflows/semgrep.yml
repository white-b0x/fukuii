name: Semgrep

# Semgrep Community Edition scan — the CodeQL substitute for fukuii's Scala 3
# codebase. CodeQL has no Scala extractor (verified against GitHub's
# supported-languages list: csharp/cpp/go/java/javascript/python/ruby/swift
# and actions — no scala entry). Uploads SARIF to the repo's Security tab
# via github/codeql-action/upload-sarif, reused here purely as a generic
# SARIF-ingestion step — this workflow does NOT run CodeQL itself.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/scala \
            --config p/security-audit \
            --config p/secrets \
            --sarif \
            --output semgrep-results.sarif

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep-results.sarif

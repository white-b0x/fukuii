logging {
  # Flag used to switch logs to the JSON format
  json-output = false

  # Logs directory
  logs-dir = ${fukuii.datadir}"/logs"

  # Logs filename
  logs-file = "fukuii"

  # Logs level - defaults to ERROR for minimal production logging
  # Only actionable activities (errors) and high-level lifecycle events are logged by default
  # Set to INFO for more detailed status messages, or DEBUG for troubleshooting
  # NB. be aware you might want to adjust pekko.loglevel as well if set to DEBUG
  # (pekko.loglevel has its own env override, ${?PEKKO_LOGLEVEL}, wired in pekko.conf)
  # Override via JVM system property: -Dlogging.logs-level=DEBUG
  # (there is no environment-variable override for this key — HOCON substitution
  # such as ${?FUKUII_LOGS_LEVEL} is not wired for logs-level)
  logs-level = "ERROR"
}
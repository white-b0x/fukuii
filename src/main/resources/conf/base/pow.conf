# This is the section dedicated to Ethash mining.
# This consensus protocol is selected by setting `fukuii.consensus.protocol = pow`.
pow {
  # Maximum number of ommers kept in the pool
  ommers-pool-size = 30
  ommer-pool-query-timeout = 60.seconds
  # Defaults to <datadir>/ethash to keep DAG files on the same volume as the database.
  # If a legacy ~/.ethash directory exists with DAG files and this directory is empty/missing,
  # EthashConfig falls back to the legacy path at startup to avoid a needless multi-GB DAG regeneration.
  ethash-dir = ${fukuii.datadir}"/ethash"
  mine-rounds = 100000
}
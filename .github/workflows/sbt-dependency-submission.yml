name: sbt Dependency Submission

# Populates GitHub's Dependency Graph with fukuii's actual resolved sbt/JVM
# dependency graph via the GitHub Dependency Submission API. This is a
# PREREQUISITE for dependency-review.yml, not an independent nice-to-have —
# actions/dependency-review-action only diffs what's already in the
# Dependency Graph, and nothing populates that graph for sbt on its own.
# Verified 2026-07: `gh api repos/{owner}/{repo}/dependency-graph/sbom`
# returned 29 packages (all from the actions/docker/pip ecosystems — zero
# JVM) despite build.sbt/project/Dependencies.scala declaring 77 direct
# dependencies (hundreds more transitively).
#
# Distinct from dependency-check.yml (weekly `sbt dependencyTree` currency
# report — no graph submission, no CVE data) and dependency-check-cve.yml
# (a separate, direct NVD CVE scan) — this workflow's only job is
# submitting the graph.
#
# Triggers on push to main/master/develop (submits the baseline graph for
# the default branch — the action's own docs recommend this as the primary
# trigger) and on same-repo pull_request (submits a graph snapshot for the
# PR's head sha, so dependency-review.yml's PR-triggered diff has both a
# base and a head snapshot to compare — without this half, the diff has
# nothing meaningful to compare a PR's dependency changes against). Fork PRs
# are skipped below: the Submission API needs a write-scoped GITHUB_TOKEN,
# which forked-repo pull_request runs never get regardless of this
# workflow's `permissions:` block — a GitHub platform restriction, not a
# config bug, same class of fork-PR limitation documented in
# `.agents/protocols/pr-preflight-checklist.md`.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: write

concurrency:
  group: sbt-dependency-submission-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  submit:
    name: Submit sbt dependency graph
    runs-on: ubuntu-latest
    # Skip fork PRs — see header comment. Same-repo branches/PRs and pushes
    # to main are unaffected.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Submit sbt dependency graph
        uses: scalacenter/sbt-dependency-submission@v2

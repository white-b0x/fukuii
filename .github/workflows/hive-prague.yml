name: Hive Prague Suite

# Runs the ethereum/eels/consume-engine simulator against fukuii for all fork_Prague tests.
# Thin caller of _hive-sim.yml — this used to be a standalone ~260-line pipeline that
# duplicated _hive-sim.yml's checkout/JDK/sbt/hive-clone/tabulate steps (and had drifted:
# its apt-based sbt install and the fixtures-URL resolution step below were unique to
# this file and hive-osaka.yml until both were ported into _hive-sim.yml itself). Fails
# the build if the pass count drops below a threshold, preventing regressions in Pectra
# EL compliance. PR-gated on main/master + manual dispatch (no schedule trigger exists
# despite what an earlier version of this comment implied).

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'build.sbt'
      - 'version.sbt'
      - 'project/**'
      - 'hive/**'
      - '.github/workflows/hive-prague.yml'
      - '.github/workflows/_hive-sim.yml'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Minimum passing test count required'
        required: false
        default: '400'
      timelimit:
        description: 'sim.timelimit (minutes)'
        required: false
        default: '40'

permissions:
  contents: read

concurrency:
  group: hive-prague-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    uses: ./.github/workflows/_hive-sim.yml
    with:
      sim: ethereum/eels/consume-engine
      label: prague
      sim_limit: '.*fork_Prague.*'
      sim_buildarg: 'disable_strict_exception_matching=nimbus-el,fukuii'
      fixtures_tag: 'v5.4.0'
      sim_timelimit: ${{ github.event.inputs.timelimit || '40' }}m
      pass_threshold: ${{ fromJSON(github.event.inputs.threshold || '400') }}
